# Site settings
title: Nidheesh V
description: Ph.D. Researcher · Mechanical Engineering · IIT Bombay
email: nidheesh.virakante@gmail.com

# Theme
theme: jekyll-theme-cayman

# Profile image (place your photo in the root directory)
profile_image: /Nidheesh.jpg

# Show download buttons in header
show_downloads: true

# Social links (used in header buttons)
linkedin_username: yourusername  # Replace with your LinkedIn username
orcid_id: 0000-0000-0000-0000    # Replace with your ORCID ID
mrl_url: https://www.me.iitb.ac.in/~a_jain/  # Materials Research Lab URL
cv_url: /cv.pdf  # Path to your CV (if you have one)

# Social links for footer (optional)
social_links:
  # twitter: yourhandle      # Uncomment and add if you use Twitter
  github: nidheeshvirakante   # Your GitHub username
  # linkedin: yourusername   # Uncomment and add if you want LinkedIn in footer

# Build settings
plugins:
  - jekyll-seo-tag
  - jekyll-relative-links

# Relative links settings
relative_links:
  enabled: true
  collections: true

# Exclude files from processing
exclude:
  - .git/
  - .github/
  - vendor/
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
